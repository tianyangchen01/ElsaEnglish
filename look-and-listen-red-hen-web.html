*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Andika,"Comic Neue","Trebuchet MS",sans-serif}
main{max-width:1040px;margin:0 auto;padding:28px 18px 48px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px 24px;margin-bottom:26px}

.tip{margin:8px 0 0;color:var(--soft);font-size:1.05rem}
.all{font:inherit;font-weight:700;font-size:1.2rem;border:3px solid var(--edge);background:var(--btn);color:var(--btnInk);
border-radius:999px;padding:12px 24px 12px 18px;display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:0 4px 0 var(--edge)}
.all:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.all svg{width:26px;height:26px;flex:none}.all span{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}.all small{font-size:.85rem;font-weight:400;opacity:.92}.tmode .all{background:var(--btn2)}
.home{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;padding:8px 14px 8px 10px;border:3px solid var(--edge);border-radius:999px;background:var(--card);color:var(--ink);font-weight:700;font-size:1rem;text-decoration:none;box-shadow:0 3px 0 var(--edge)}
.home svg{width:20px;height:20px}.home:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.home:focus-visible{outline:4px solid #2f7fd0;outline-offset:3px}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.seg{display:flex;border:3px solid var(--edge);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{font:inherit;font-weight:700;font-size:1.05rem;border:0;background:none;color:var(--ink);padding:12px 18px;cursor:pointer}
.seg button[aria-checked="true"]{background:var(--btn);color:var(--btnInk)}
.seg button[data-m="t"][aria-checked="true"]{background:var(--btn2)}
.grid{display:grid;gap:22px;grid-template-columns:1fr}
@media (min-width:720px){.grid{grid-template-columns:1fr 1fr;gap:28px}}
.card{background:var(--card);border:3px solid var(--edge);border-radius:22px;overflow:hidden;box-shadow:0 6px 0 var(--edge)}
.card.playing{outline:5px solid var(--hi);outline-offset:3px}
.pic{display:block;width:100%;padding:0;border:0;border-bottom:3px solid var(--edge);background:none;cursor:pointer;position:relative}
.pic svg{display:block;width:100%;height:auto}
.n{position:absolute;top:10px;left:10px;width:40px;height:40px;border-radius:50%;background:var(--card);color:var(--ink);
border:3px solid var(--edge);display:grid;place-items:center;font-weight:700;font-size:1.3rem}
.line{margin:0;padding:16px 14px 20px;display:flex;flex-wrap:wrap;gap:4px 2px;justify-content:center}
.w{font:inherit;font-size:clamp(1.6rem,4.2vw,2.1rem);font-weight:700;color:var(--ink);background:none;border:0;border-radius:12px;
padding:2px 8px;cursor:pointer;transition:transform .12s,background-color .12s}
.w:hover{background:color-mix(in srgb,var(--hi) 35%,transparent)}
.w.on{background:var(--hi);color:var(--hiInk);transform:translateY(-4px) scale(1.06)}
button:focus-visible{outline:4px solid #2f7fd0;outline-offset:3px}
.err{margin-top:18px;color:var(--btn);font-weight:700}
@media (prefers-reduced-motion:reduce){.w{transition:none}.w.on{transform:none}}
</style></head><body>
