<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EnglishGain 英文單字樂園</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF0DC; --bg2:#FFE0B8; --text:#23264F; --soft:#6A5A80;
  --card:#FFFFFF; --line:#23264F;
  --grape:#6B3FA0; --sun:#FFD23F; --mint:#2FCB8A; --pink:#FF6B8B; --sky:#3BA7F0; --orange:#FF9F43;
  --vowel:#E8452C;
  --shadow:#23264F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-set="i"]{--bg:#DDF1FF;--bg2:#C4E6FF;--vowel:#E8457A;--soft:#5A5F8F}
:root[data-set="e"]{--bg:#E2F7EC;--bg2:#C6EDD8;--vowel:#13804F;--soft:#4F6B60}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2A1E3A; --bg2:#3A2A52; --text:#FFF4EA; --soft:#D8C6E8;
    --card:#3B2F60; --line:#120C22; --shadow:#0D0819; --vowel:#FF7A5C;
  }
}
:root[data-theme="dark"]{
  --bg:#2A1E3A; --bg2:#3A2A52; --text:#FFF4EA; --soft:#D8C6E8;
  --card:#3B2F60; --line:#120C22; --shadow:#0D0819; --vowel:#FF7A5C;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--text);
  background:var(--bg);
  background-image:radial-gradient(circle at 1px 1px, var(--bg2) 2px, transparent 2.5px);
  background-size:28px 28px;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  -webkit-tap-highlight-color:transparent;
  user-select:none; -webkit-user-select:none;
}
.en{font-family:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
button:focus-visible{outline:4px solid var(--sky);outline-offset:3px}

.wrap{max-width:760px;margin:0 auto;padding:12px 16px 32px}

.top{display:flex;align-items:flex-end;gap:10px;min-height:96px}
.mascot{width:64px;flex:none;transform-origin:50% 100%}
.mascot.jump{animation:jump .6s ease}
.mascot.wobble{animation:wobble .5s ease}
.mascot.talk .mouth{animation:talk .25s 3 alternate}
@keyframes jump{0%,100%{transform:translateY(0)}35%{transform:translateY(-26px) scaleY(1.05)}60%{transform:translateY(0) scaleY(.9)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes talk{to{transform:scaleY(1.8)}}
.mouth{transform-box:fill-box;transform-origin:center}
.bubble{
  position:relative;background:var(--card);border:3px solid var(--line);border-radius:18px;
  padding:10px 14px;font-weight:700;font-size:clamp(16px,4.2vw,20px);line-height:1.4;
  margin-bottom:26px;flex:1;
}
.bubble::before{content:"";position:absolute;left:-12px;bottom:12px;border:10px solid transparent;border-right-color:var(--line);border-left:0}
.bubble::after{content:"";position:absolute;left:-7px;bottom:14px;border:8px solid transparent;border-right-color:var(--card);border-left:0}
.home{
  flex:none;align-self:flex-start;margin-top:8px;width:52px;height:52px;border-radius:16px;
  background:var(--card);border:3px solid var(--line);box-shadow:0 4px 0 var(--shadow);font-size:24px;
}
.home:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.home[hidden]{display:none}
.sitehome{display:inline-flex;align-items:center;gap:6px;margin:6px 0 4px;padding:8px 14px 8px 10px;border:3px solid var(--line);border-radius:999px;background:var(--card);color:var(--text);font-weight:800;font-size:16px;text-decoration:none;box-shadow:0 3px 0 var(--shadow)}
.sitehome:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.sitehome[hidden]{display:none}
.sitehome svg{width:20px;height:20px}
.sitehome:focus-visible{outline:4px solid var(--sky);outline-offset:3px}

.screen{display:none}
.screen.active{display:block}

.title{font-family:"Baloo 2","Noto Sans TC",sans-serif;font-weight:800;font-size:clamp(34px,9vw,60px);line-height:1;margin:6px 0 4px}
.title .wl{display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:12px}
.chip{
  display:inline-block;background:var(--card);border:3px solid var(--line);border-radius:14px;
  padding:0 12px 2px;font-size:clamp(24px,6vw,36px);box-shadow:0 4px 0 var(--shadow);
}
button.chip{cursor:pointer;line-height:inherit;transition:transform .12s,background-color .12s}
button.chip:hover{background:color-mix(in srgb,var(--sun) 30%,var(--card))}
button.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
button.chip.on{background:var(--sun);color:#23264F;animation:chipPop .45s ease}
@keyframes chipPop{40%{transform:translateY(-6px) scale(1.08)}}
@media (prefers-reduced-motion:reduce){button.chip.on{animation:none}}
.vw{color:var(--vowel)}
.lead{color:var(--soft);font-weight:700;margin:14px 0 18px;font-size:17px}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mbtn{
  position:relative;text-align:left;border:3px solid var(--line);border-radius:22px;
  padding:16px 14px 14px;min-height:150px;box-shadow:0 6px 0 var(--shadow);color:#23264F;
  display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
}
.mbtn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--shadow)}
.mbtn .ic{font-size:44px;line-height:1}
.mbtn b{font-size:clamp(20px,5vw,26px);font-weight:900;display:block}
.mbtn small{font-size:14px;font-weight:700;opacity:.8}
.m1{background:var(--sun)} .m2{background:var(--mint)} .m3{background:#8FD0FF} .m4{background:#FF9DB1}
.stars-total{margin-top:18px;font-weight:700;color:var(--soft);font-size:16px}

.prog{display:flex;gap:7px;justify-content:center;margin:4px 0 14px;flex-wrap:wrap}
.prog i{width:14px;height:14px;border-radius:50%;border:3px solid var(--line);background:var(--card)}
.prog i.done{background:var(--sun)}
.prog i.now{background:var(--pink);transform:scale(1.2)}
.bigbtn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--sun);color:#23264F;border:3px solid var(--line);border-radius:18px;
  padding:12px 20px;font-weight:900;font-size:20px;box-shadow:0 5px 0 var(--shadow);min-height:56px;
}
.bigbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
.bigbtn.alt{background:var(--card);color:var(--text)}
.bigbtn:disabled{opacity:.35;pointer-events:none}
.center{text-align:center}
.pic svg{width:100%;height:100%;display:block}

.lcard{
  background:var(--card);border:4px solid var(--line);border-radius:28px;box-shadow:0 8px 0 var(--shadow);
  padding:18px;text-align:center;max-width:420px;margin:0 auto;
}
.lcard .pic{width:min(62vw,230px);aspect-ratio:1;margin:0 auto;display:block;border-radius:20px;background:#FFF8EE}
.lcard .pic:active{transform:scale(.96)}
.lword{display:block;margin:4px auto 0;font-size:clamp(64px,18vw,104px);font-weight:800;line-height:1.05;letter-spacing:4px}
.lzh{font-size:22px;font-weight:900;color:var(--soft)}
.lnav{display:flex;justify-content:center;gap:12px;margin-top:20px;flex-wrap:wrap}
.pop-in{animation:popin .35s ease}
@keyframes popin{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}

.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:480px;margin:16px auto 0}
.opt{
  background:var(--card);border:4px solid var(--line);border-radius:24px;box-shadow:0 6px 0 var(--shadow);
  padding:10px;aspect-ratio:1/1.08;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
.opt .pic{width:78%;aspect-ratio:1;background:#FFF8EE;border-radius:16px}
.opt .cap{font-size:30px;font-weight:800;height:34px;line-height:34px;visibility:hidden}
.opt.right{background:#C9F7DF;border-color:#13804F}
.opt.right .cap{visibility:visible;color:#23264F}
.opt.wrong{opacity:.35;animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.spellpic{
  width:min(52vw,200px);aspect-ratio:1;margin:0 auto;background:#FFF8EE;border:4px solid var(--line);
  border-radius:24px;box-shadow:0 6px 0 var(--shadow);padding:10px;display:block;
}
.blanks{display:flex;justify-content:center;gap:12px;margin:22px 0 18px}
.blank{
  width:clamp(62px,17vw,84px);height:clamp(74px,20vw,96px);border-bottom:6px solid var(--line);
  font-size:clamp(52px,14vw,72px);font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1;
}
.blank.fill{animation:popin .3s ease}
.blank.next{border-bottom-color:var(--pink)}
.blanks.win .blank{color:var(--mint)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:440px;margin:0 auto}
.tile{
  width:clamp(64px,18vw,82px);height:clamp(64px,18vw,82px);border-radius:20px;border:4px solid var(--line);
  background:var(--sun);color:#23264F;font-size:clamp(40px,11vw,54px);font-weight:800;line-height:1;
  box-shadow:0 6px 0 var(--shadow);padding-bottom:6px;
}
.tile:nth-child(3n+2){background:#8FD0FF}
.tile:nth-child(3n){background:#FF9DB1}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shadow)}
.tile.used{visibility:hidden}
.tile.no{animation:shake .4s}

.target{
  display:flex;align-items:center;gap:14px;justify-content:center;
  background:var(--card);border:4px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--shadow);
  padding:10px 14px;max-width:360px;margin:0 auto;
}
.target .pic{width:96px;height:96px;background:#FFF8EE;border-radius:14px}
.target b{font-size:19px}
.sky{
  position:relative;height:clamp(340px,56vh,540px);margin-top:16px;border:4px solid var(--line);border-radius:28px;
  overflow:hidden;background:linear-gradient(#8FD0FF,#D8F0FF);
}
:root[data-theme="dark"] .sky{background:linear-gradient(#2A3E8C,#4B5CB8)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sky{background:linear-gradient(#2A3E8C,#4B5CB8)}}
.cloud{position:absolute;background:#fff;border-radius:40px;opacity:.85;height:26px}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:34px;height:34px;left:12px;top:-16px}
.cloud::after{width:24px;height:24px;left:38px;top:-10px}
.balloon{position:absolute;width:24%;max-width:130px;top:100%;animation:rise var(--dur) linear var(--delay) infinite}
.balloon .sway{display:block;animation:sway 2.4s ease-in-out infinite alternate}
.balloon .body{
  display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:.85;
  border-radius:50% 50% 48% 48% / 55% 55% 45% 45%;border:3px solid rgba(0,0,0,.35);
  color:#fff;font-size:clamp(24px,6.5vw,38px);font-weight:800;text-shadow:0 2px 0 rgba(0,0,0,.35);position:relative;
}
.balloon .body::before{content:"";position:absolute;width:22%;height:16%;left:20%;top:16%;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(-30deg)}
.balloon .string{display:block;width:2px;height:46px;margin:6px auto 0;background:rgba(35,38,79,.6)}
.balloon.no .sway{animation:shake .4s}
.balloon.popped{pointer-events:none}
.balloon.popped .sway{animation:burst .35s forwards}
@keyframes burst{to{transform:scale(1.6);opacity:0}}
@keyframes rise{from{top:100%}to{top:-55%}}
@keyframes sway{from{transform:translateX(-6px) rotate(-3deg)}to{transform:translateX(6px) rotate(3deg)}}

.done{text-align:center;padding-top:10px}
.done h2{font-size:clamp(40px,11vw,64px);margin:6px 0;font-weight:900}
.starrow{font-size:clamp(30px,8vw,48px);letter-spacing:3px;min-height:60px}
.starrow span{display:inline-block;animation:popin .4s ease both}
.starrow .off{filter:grayscale(1);opacity:.3}
.done p{font-size:20px;font-weight:700;color:var(--soft)}
.done .lnav{margin-top:24px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-20px;width:12px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media (prefers-reduced-motion: reduce){
  .mascot.jump,.mascot.wobble,.pop-in,.blank.fill,.starrow span{animation:none}
  .balloon{animation-duration:calc(var(--dur) * 2.5)}
  .balloon .sway{animation:none}
  .confetti{display:none}
}

.sets{display:grid;gap:16px;margin-top:8px}
.setcard{display:flex;gap:16px;align-items:center;text-align:left;background:var(--card);border:4px solid var(--line);border-radius:24px;box-shadow:0 6px 0 var(--shadow);padding:14px 18px}
.setcard:active{transform:translateY(5px);box-shadow:0 1px 0 var(--shadow)}
.setcard svg{width:58px;flex:none}
.setcard b{font-size:clamp(22px,5.5vw,28px);font-weight:900;display:block}
.setcard small{font-size:15px;font-weight:700;color:var(--soft)}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mini span{font-size:20px;font-weight:800;border:2px solid var(--line);border-radius:10px;padding:0 8px;background:var(--bg)}
.setstar{margin-left:auto;flex:none;font-weight:900;font-size:16px;white-space:nowrap}
.switch{margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <a class="sitehome" id="siteHome" href="index.html" aria-label="回網站首頁"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.2 12 4l9 7.2V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg>回首頁</a>
  <div class="top">
    <svg class="mascot" id="mascot" viewBox="0 0 70 92" aria-hidden="true"></svg>
    <div class="bubble" id="bubble">嗨！今天想練習哪一組單字呢？</div>
    <button class="home" id="homeBtn" hidden aria-label="回到選單">🏠</button>
  </div>

  <section class="screen active" id="s-pick">
    <h1 class="title">英文單字樂園</h1>
    <p class="lead">選一組單字開始玩！記得打開聲音 🔊</p>
    <div class="sets" id="sets"></div>
  </section>

  <section class="screen" id="s-menu">
    <h1 class="title"><span id="mtitle"></span>
      <span class="wl en" id="chips"></span>
    </h1>
    <p class="lead" id="mlead"></p>
    <div class="menu">
      <button class="mbtn m1" data-go="learn"><span class="ic">📖</span><span><b>認識單字</b><small>看圖、聽發音</small></span></button>
      <button class="mbtn m2" data-go="listen"><span class="ic">👂</span><span><b>聽音選圖</b><small>聽到什麼就點什麼</small></span></button>
      <button class="mbtn m3" data-go="spell"><span class="ic">🔤</span><span><b>拼拼看</b><small>把字母放回去</small></span></button>
      <button class="mbtn m4" data-go="balloon"><span class="ic">🎈</span><span><b>戳氣球</b><small>找到對的氣球</small></span></button>
    </div>
    <div class="switch">
      <span class="stars-total" id="starsTotal" style="margin:0"></span>
      <button class="bigbtn alt" id="switchBtn">🔄 換一組單字</button>
    </div>
  </section>

  <section class="screen" id="s-learn"></section>
  <section class="screen" id="s-listen"></section>
  <section class="screen" id="s-spell"></section>
  <section class="screen" id="s-balloon"></section>
  <section class="screen" id="s-done"></section>
</div>
<div class="confetti" id="confetti"></div>

<script>
/* ================= pictures ================= */
const L = '#23264F', SK = '#F6C79E';
const speedSVG = `<svg viewBox="0 0 120 120">
  <path d="M4 50h22 M0 64h28 M8 78h18" stroke="#3BA7F0" stroke-width="5" stroke-linecap="round"/>
  <circle cx="26" cy="92" r="7" fill="#D6DAE6" opacity=".9"/><circle cx="16" cy="88" r="5" fill="#D6DAE6" opacity=".7"/><circle cx="8" cy="94" r="3.5" fill="#D6DAE6" opacity=".5"/>
  <path d="M32 84 V68 q0-6 6-8 l14-5 l10-13 q3-4 8-4 h18 q6 0 9 5 l8 13 q9 2 9 11 v17 z" fill="#FF6B8B" stroke="${L}" stroke-width="4" stroke-linejoin="round"/>
  <path d="M60 56 l8-11 h16 l7 11 z" fill="#BDE6FF" stroke="${L}" stroke-width="3" stroke-linejoin="round"/>
  <path d="M40 70 h70" stroke="#FFD23F" stroke-width="5"/>
  <circle cx="50" cy="86" r="12" fill="${L}"/><circle cx="50" cy="86" r="4.5" fill="#E9EDF5"/>
  <circle cx="96" cy="86" r="12" fill="${L}"/><circle cx="96" cy="86" r="4.5" fill="#E9EDF5"/>
  <path d="M84 20 l-8 14 h8 l-6 12 l14 -18 h-8 l6 -8z" fill="#FFD23F" stroke="${L}" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
const WORDS_I = [
  {w:'ink', zh:'墨水', pic:`<svg viewBox="0 0 120 120">
    <rect x="40" y="14" width="40" height="16" rx="4" fill="#3B3F8C" stroke="${L}" stroke-width="4"/>
    <path d="M44 30h32v10l12 14v46a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8V54l12-14z" fill="#EAF6FF"/>
    <path d="M32 64h56v36a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8z" fill="#2E3FB8"/>
    <path d="M44 30h32v10l12 14v46a8 8 0 0 1-8 8H40a8 8 0 0 1-8-8V54l12-14z" fill="none" stroke="${L}" stroke-width="4" stroke-linejoin="round"/>
    <rect x="44" y="74" width="32" height="18" rx="4" fill="#fff" stroke="${L}" stroke-width="2.5"/>
    <text x="60" y="88" text-anchor="middle" font-family="Baloo 2,Arial" font-weight="800" font-size="14" fill="${L}">INK</text>
    <path d="M102 58c0 0-9 11-9 17a9 9 0 0 0 18 0c0-6-9-17-9-17z" fill="#2E3FB8" stroke="${L}" stroke-width="3"/>
    <circle cx="98" cy="74" r="2.5" fill="#fff" opacity=".8"/>
    <ellipse cx="18" cy="108" rx="12" ry="4" fill="#2E3FB8" opacity=".8"/></svg>`},
  {w:'zip', zh:'速度（咻～飛快）', pic:speedSVG},
  {w:'in', zh:'在…裡面', pic:`<svg viewBox="0 0 120 120">
    <path d="M22 62 L10 44 L44 44 L52 62Z" fill="#C9853F" stroke="${L}" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M98 62 L110 44 L76 44 L68 62Z" fill="#C9853F" stroke="${L}" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M42 46 L46 26 L56 40Z M78 46 L74 26 L64 40Z" fill="#FFD23F" stroke="${L}" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="60" cy="58" r="22" fill="#FFD23F" stroke="${L}" stroke-width="3.5"/>
    <circle cx="52" cy="54" r="3.5" fill="${L}"/><circle cx="68" cy="54" r="3.5" fill="${L}"/>
    <path d="M57 61 L63 61 L60 64Z" fill="#FF6B8B"/>
    <rect x="22" y="62" width="76" height="46" rx="4" fill="#E8A85B" stroke="${L}" stroke-width="3.5"/>
    <path d="M32 74 h56" stroke="#C9853F" stroke-width="3" stroke-dasharray="6 5"/>
    <path d="M26 20 v14 m-6 -6 l6 6 l6 -6" stroke="#2FCB8A" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`},
  {w:'hip', zh:'臀部（屁股）', pic:`<svg viewBox="0 0 120 120">
    <ellipse cx="60" cy="78" rx="30" ry="11" fill="none" stroke="#FF6B8B" stroke-width="3.5" stroke-dasharray="6 5"/>
    <path d="M50 46 L30 60 L45 75" fill="none" stroke="#F2B78C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M70 46 L90 60 L75 75" fill="none" stroke="#F2B78C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="45" y="40" width="30" height="36" rx="8" fill="#2FCB8A" stroke="${L}" stroke-width="3.5"/>
    <path d="M44 72 h32 v14 h-32z" fill="#6B3FA0" stroke="${L}" stroke-width="3.5" stroke-linejoin="round"/>

function webSVG(){
  const c = 60, R = [14, 27, 40, 52];

  return `<svg viewBox="0 0 120 120"><path d="${spokes}" stroke="#7A86A8" stroke-width="2.5" stroke-linecap="round"/>

}

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const wait = ms => new Promise(r => setTimeout(r, ms));
const pick = a => a[Math.floor(Math.random()*a.length)];
let SET = SETS[0], WORDS = SET.words, VOWEL = SET.vowel;
const colorWord = (w, v = VOWEL) => w.split('').map(c => c===v ? `<span class="vw">${c}</span>` : c).join('');
const others = (o, n) => shuffle(WORDS.filter(x => x !== o)).slice(0, n);

function getStars(id){ try{ return parseInt(localStorage.getItem('eg_stars_'+id) || '0', 10) || 0; }catch(e){ return 0; } }
function addStars(id, n){ try{ localStorage.setItem('eg_stars_'+id, String(getStars(id) + n)); }catch(e){} }

const clips = {}, buffers = {};
for(const w in AUDIO){ try{ const a = new Audio(AUDIO[w]); a.preload = 'auto'; clips[w] = a; }catch(e){} }
let playing = null, curSrc = null, decoding = false;
function getAC(){ ac = ac || new (window.AudioContext || window.webkitAudioContext)(); return ac; }
function b64ToBuf(u){ const b = atob(u.split(',')[1]); const a = new Uint8Array(b.length); for(let i=0;i<b.length;i++) a[i] = b.charCodeAt(i); return a.buffer; }
/* decode every recording once, on the first touch, so playback is instant and never clipped */
function warmUp(){
  if(decoding) return; decoding = true;
  try{
    const c = getAC(); if(c.state === 'suspended') c.resume();
    for(const w in AUDIO){
      c.decodeAudioData(b64ToBuf(AUDIO[w]), buf => { buffers[w] = buf; }, () => {});
    }
  }catch(e){}
}
['pointerdown','touchstart','keydown'].forEach(ev => window.addEventListener(ev, warmUp, {once:true, passive:true}));

function stopAll(){
  if(curSrc){ try{ curSrc.stop(); }catch(e){} curSrc = null; }
  if(playing){ try{ playing.pause(); }catch(e){} playing = null; }
  try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){}
}

let voice = null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices().filter(v => /^en[-_]US/i.test(v.lang));
    voice = vs.find(v => /Natural|Online/i.test(v.name)) || vs.find(v => /Google US English|Samantha|Aria|Jenny|Ava|Allison/i.test(v.name)) || vs[0] || null;
  }catch(e){}
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function tts(text, rate){
  if(!('speechSynthesis' in window)) return;
  try{
    if(!voice) pickVoice();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = rate; u.pitch = 1;
    if(voice) u.voice = voice;
    speechSynthesis.speak(u);
  }catch(e){}
}
function playClip(text, slow){
  const a = clips[text]; if(!a) return false;
  try{
    a.currentTime = 0;
    a.playbackRate = slow ? .65 : 1;
    a.preservesPitch = true; a.webkitPreservesPitch = true;
    playing = a;
    const pr = a.play();
    if(pr && pr.catch) pr.catch(() => tts(text, slow ? .5 : .9));
    return true;
  }catch(e){ return false; }
}
/* real recorded voice first; slow = same recording played slower */
function say(text, rate = 1){
  mascot('talk');
  stopAll();
  const slow = rate < 1;
  if(!slow && buffers[text]){
    try{
      const c = getAC(); if(c.state === 'suspended') c.resume();
      const s = c.createBufferSource(); s.buffer = buffers[text];
      s.connect(c.destination); s.start(c.currentTime + .02);
      curSrc = s; return;
    }catch(e){}
  }
  if(playClip(text, slow)) return;
  tts(text, slow ? .5 : .9);
}

let ac;
function tone(freqs, dur=.15, type='triangle', gap=.08, vol=.18){
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if(ac.state === 'suspended') ac.resume();
    const t0 = ac.currentTime;
    freqs.forEach((f,i) => {
      const o = ac.createOscillator(), g = ac.createGain(), s = t0 + i*gap;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(vol, s+.01);
      g.gain.exponentialRampToValueAtTime(.001, s+dur);
      o.connect(g).connect(ac.destination); o.start(s); o.stop(s+dur+.03);
    });
  }catch(e){}
}
const sfx = {
  good: () => tone([523,659,784,1047], .2),
  bad:  () => tone([260,200], .22, 'sine', .13, .2),
  pop:  () => tone([900,1400], .07, 'square', .03, .08),
  tap:  () => tone([700], .08)
};

const mEl = $('#mascot');
function mascot(kind){
  mEl.classList.remove('jump','wobble','talk'); void mEl.offsetWidth; mEl.classList.add(kind);
  setTimeout(() => mEl.classList.remove(kind), 800);
}
function bubble(t){ $('#bubble').textContent = t; }
const PRAISE = ['好棒！','答對了！','你好厲害！','太讚了！','完全正確！'];
const OOPS = ['再試一次！','差一點點！','沒關係，再聽一次！'];

const screens = ['pick','menu','learn','listen','spell','balloon','done'];
let token = 0;
function show(name){
  token++;
  screens.forEach(s => $('#s-'+s).classList.toggle('active', s === name));
  $('#homeBtn').hidden = name === 'menu' || name === 'pick';
  $('#siteHome').hidden = !(name === 'menu' || name === 'pick');
  window.scrollTo(0,0);
}
function progress(n, now){
  return '<div class="prog">' + Array.from({length:n}, (_,i) => `<i class="${i<now?'done':i===now?'now':''}"></i>`).join('') + '</div>';
}

/* ================= set picker ================= */
const MASCOT_DEFAULT = `<circle cx="35" cy="50" r="30" fill="#FFD23F" stroke="#23264F" stroke-width="3"/><circle cx="26" cy="44" r="5" fill="#fff"/><circle cx="44" cy="44" r="5" fill="#fff"/><circle cx="27" cy="45" r="2.4" fill="#23264F"/><circle cx="45" cy="45" r="2.4" fill="#23264F"/><ellipse class="mouth" cx="35" cy="60" rx="6" ry="3" fill="#FF6B8B" stroke="#23264F" stroke-width="2"/>`;
function showPick(){
  show('pick');
  document.documentElement.removeAttribute('data-set');
  mEl.innerHTML = MASCOT_DEFAULT;
  bubble('嗨！今天想練習哪一組單字呢？');
  $('#sets').innerHTML = SETS.map(s => `
    <button class="setcard" data-set="${s.id}">
      <svg viewBox="0 0 70 92" aria-hidden="true">${s.mascot}</svg>
      <span><b>${s.buddy} 的單字</b><small>${s.name}・${s.words.length} 個字</small>
        <span class="mini en">${s.words.map(w => `<span>${w.w.split('').map(c => c===s.vowel ? `<span style="color:${s.color};border:0;padding:0;background:none">${c}</span>` : c).join('')}</span>`).join('')}</span>
      </span>
      ${getStars(s.id) ? `<span class="setstar">⭐ ${getStars(s.id)}</span>` : ''}
    </button>`).join('');
  document.querySelectorAll('.setcard').forEach(b => b.onclick = () => { sfx.tap(); chooseSet(b.dataset.set); });
}
function chooseSet(id){
  SET = SETS.find(s => s.id === id) || SETS[0];
  WORDS = SET.words; VOWEL = SET.vowel;
  document.documentElement.setAttribute('data-set', SET.id);
  mEl.innerHTML = SET.mascot;
  try{ localStorage.setItem('eg_last_set', SET.id); }catch(e){}
  showMenu();
}

/* ================= menu ================= */
function showMenu(){
  show('menu');
  $('#mtitle').textContent = SET.buddy + ' 的單字樂園';
  $('#chips').innerHTML = WORDS.map(o => `<button class="chip" data-w="${o.w}" aria-label="聽 ${o.w} 的發音">${colorWord(o.w)}</button>`).join('');
  $('#mlead').textContent = SET.lead || `這組單字都有${SET.name}的聲音。先認識單字，再挑一個遊戲玩！`;
  bubble(`我是${SET.buddy}！想玩哪一個遊戲呢？`);
  const n = getStars(SET.id);
  $('#starsTotal').textContent = n ? `這組已經收集了 ${n} 顆星星 ⭐` : '';
}
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { sfx.tap(); start(b.dataset.go); }));
$('#chips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if(!c) return;
  warmUp(); say(c.dataset.w);
  c.classList.remove('on'); void c.offsetWidth; c.classList.add('on');
  clearTimeout(c._t); c._t = setTimeout(() => c.classList.remove('on'), 700);
});
$('#homeBtn').addEventListener('click', () => { stopAll(); showMenu(); });
$('#switchBtn').addEventListener('click', () => { sfx.tap(); showPick(); });
function start(g){ ({learn:startLearn, listen:startListen, spell:startSpell, balloon:startBalloon})[g](); }

/* ================= learn ================= */
let li = 0;
function startLearn(){ li = 0; show('learn'); bubble('點圖片或單字，就可以聽發音喔！'); renderLearn(); }
function renderLearn(){
  const o = WORDS[li], last = li === WORDS.length - 1;
  $('#s-learn').innerHTML = progress(WORDS.length, li) + `
    <div class="lcard pop-in">
      <button class="pic" id="lpic" aria-label="聽 ${o.w}">${o.pic}</button>
      <button class="lword en" id="lword">${colorWord(o.w)}</button>
      <div class="lzh">${o.zh}</div>
    </div>
    <div class="lnav">
      <button class="bigbtn alt" id="lprev" ${li===0?'disabled':''}>◀ 上一個</button>
      <button class="bigbtn alt" id="lslow">🐢 慢慢唸</button>
      ${last ? '<button class="bigbtn" id="lplay">去玩遊戲！</button>' : '<button class="bigbtn" id="lnext">下一個 ▶</button>'}
    </div>`;
  $('#lpic').onclick = $('#lword').onclick = () => say(o.w);
  $('#lslow').onclick = () => say(o.w, .5);
  $('#lprev').onclick = () => { li--; renderLearn(); };
  if(last) $('#lplay').onclick = showMenu; else $('#lnext').onclick = () => { li++; renderLearn(); };
  setTimeout(() => say(o.w), 250);
}

/* ================= listen ================= */
let LS;
function startListen(){
  const r = WORDS.length >= 8 ? shuffle(WORDS).slice(0, 10) : shuffle(WORDS).concat(shuffle(WORDS)).slice(0, 8);
  LS = { rounds: r, r: 0, stars: 0 }; show('listen'); renderListen();
}
function renderListen(){
  const tk = token, target = LS.rounds[LS.r];
  const opts = shuffle([target, ...others(target, Math.min(3, WORDS.length - 1))]);
  let miss = false, locked = false;
  bubble('仔細聽，點出正確的圖片！');
  $('#s-listen').innerHTML = progress(LS.rounds.length, LS.r) + `
    <div class="center"><button class="bigbtn" id="again">🔊 再聽一次</button></div>
    <div class="grid4">${opts.map(o => `
      <button class="opt" data-w="${o.w}" aria-label="${o.zh}"><span class="pic">${o.pic}</span><span class="cap en">${colorWord(o.w)}</span></button>`).join('')}
    </div>`;
  $('#again').onclick = () => say(target.w);
  document.querySelectorAll('#s-listen .opt').forEach(b => b.onclick = async () => {
    if(locked || b.classList.contains('wrong')) return;
    if(b.dataset.w === target.w){
      locked = true; b.classList.add('right'); sfx.good(); mascot('jump');
      if(!miss) LS.stars++;
      bubble(pick(PRAISE) + ' 這是 ' + target.w);
      await wait(350); say(target.w);
      await wait(1400); if(tk !== token) return;
      LS.r++; LS.r < LS.rounds.length ? renderListen() : finish(LS.stars, LS.rounds.length, startListen);
    } else {
      miss = true; b.classList.add('wrong'); sfx.bad(); mascot('wobble'); bubble(pick(OOPS));
      setTimeout(() => { if(tk === token) say(target.w); }, 600);
    }
  });
  setTimeout(() => { if(tk === token) say(target.w); }, 450);
}

/* ================= spell ================= */
let SS;
function startSpell(){ SS = { rounds: shuffle(WORDS).slice(0, 6), r: 0, stars: 0 }; show('spell'); renderSpell(); }
function renderSpell(){
  const tk = token, o = SS.rounds[SS.r];
  /* look-alike consonants make good distractors: b/d/p, m/n, t/r */
  const extra = shuffle('bdpmnrtgkhz'.split('').filter(c => !o.w.includes(c))).slice(0, 2);
  const tiles = shuffle(o.w.split('').concat(extra));
  let pos = 0, miss = false;
  bubble('看圖聽聲音，照順序點字母！');
  $('#s-spell').innerHTML = progress(SS.rounds.length, SS.r) + `
    <button class="spellpic pic" id="spic" aria-label="聽單字">${o.pic}</button>
    <div class="center" style="margin-top:12px"><button class="bigbtn alt" id="shear">🔊 聽一聽</button></div>
    <div class="blanks en" id="blanks">${o.w.split('').map((_,i) => `<div class="blank${i===0?' next':''}"></div>`).join('')}</div>
    <div class="tiles en">${tiles.map(c => `<button class="tile" data-c="${c}">${c}</button>`).join('')}</div>`;
  $('#spic').onclick = $('#shear').onclick = () => say(o.w);
  const blanks = [...document.querySelectorAll('#blanks .blank')];
  document.querySelectorAll('#s-spell .tile').forEach(t => t.onclick = async () => {
    if(pos >= o.w.length || t.classList.contains('used')) return;
    if(t.dataset.c === o.w[pos]){
      sfx.tap(); t.classList.add('used');
      const b = blanks[pos]; b.innerHTML = t.dataset.c === VOWEL ? `<span class="vw">${VOWEL}</span>` : t.dataset.c;
      b.classList.remove('next'); b.classList.add('fill');
      pos++;
      if(pos < o.w.length){ blanks[pos].classList.add('next'); return; }
      $('#blanks').classList.add('win'); sfx.good(); mascot('jump');
      if(!miss) SS.stars++;
      bubble(pick(PRAISE) + ' ' + o.w + '！');
      await wait(350); say(o.w);
      await wait(1600); if(tk !== token) return;
      SS.r++; SS.r < SS.rounds.length ? renderSpell() : finish(SS.stars, SS.rounds.length, startSpell);
    } else {
      miss = true; sfx.bad(); mascot('wobble');
      t.classList.remove('no'); void t.offsetWidth; t.classList.add('no');
      bubble('不是這個喔，仔細聽聽看！');
    }
  });
  setTimeout(() => { if(tk === token) say(o.w); }, 400);
}

/* ================= balloons ================= */
let BS;
const BCOLORS = ['#FF6B8B','#3BA7F0','#2FCB8A','#FF9F43'];
function startBalloon(){
  const r = WORDS.length >= 8 ? shuffle(WORDS).slice(0, 8) : shuffle(WORDS).concat(shuffle(WORDS).slice(0, 2));
  BS = { rounds: r, r: 0, stars: 0 }; show('balloon'); renderBalloon();
}
function renderBalloon(){
  const tk = token, o = BS.rounds[BS.r];
  const set = shuffle([o, ...others(o, Math.min(3, WORDS.length - 1))]);
  let miss = false, done = false;
  bubble('找到圖片的英文，戳破那顆氣球！');
  $('#s-balloon').innerHTML = progress(BS.rounds.length, BS.r) + `
    <button class="target" id="btarget"><span class="pic">${o.pic}</span><b>🔊 是哪一顆？</b></button>
    <div class="sky" id="sky">
      <div class="cloud" style="width:90px;left:8%;top:18%"></div>
      <div class="cloud" style="width:70px;right:10%;top:55%"></div>
      ${set.map((w,i) => {
        const dur = (8 + Math.random()*3).toFixed(1), delay = (-Math.random()*dur).toFixed(1);
        return `<button class="balloon en" data-w="${w.w}" style="left:${2 + i*24.5}%;--dur:${dur}s;--delay:${delay}s" aria-label="${w.w}">
          <span class="sway"><span class="body" style="background:${BCOLORS[i]}">${w.w}</span><span class="string"></span></span></button>`;
      }).join('')}
    </div>`;
  $('#btarget').onclick = () => say(o.w);
  document.querySelectorAll('#sky .balloon').forEach(b => b.onclick = async () => {
    if(done || b.classList.contains('popped')) return;
    if(b.dataset.w === o.w){
      done = true; b.classList.add('popped'); sfx.pop(); setTimeout(sfx.good, 120); mascot('jump');
      if(!miss) BS.stars++;
      bubble(pick(PRAISE) + ' ' + o.w + '！');
      await wait(400); say(o.w);
      await wait(1400); if(tk !== token) return;
      BS.r++; BS.r < BS.rounds.length ? renderBalloon() : finish(BS.stars, BS.rounds.length, startBalloon);
    } else {
      miss = true; sfx.bad(); mascot('wobble'); bubble('這顆是 ' + b.dataset.w + '，再找找看！');
      say(b.dataset.w);
      b.classList.remove('no'); void b.offsetWidth; b.classList.add('no');
    }
  });
  setTimeout(() => { if(tk === token) say(o.w); }, 400);
}

/* ================= finish ================= */
function finish(stars, max, again){
  addStars(SET.id, stars);
  show('done');
  const ratio = stars / max;
  const msg = ratio === 1 ? '全部第一次就答對，超級厲害！' : ratio >= .6 ? '做得很好！再玩一次會更棒！' : '有進步喔！再練習一次吧！';
  bubble(ratio === 1 ? '哇！你是單字小高手！' : '你好認真，給你拍拍手！');
  $('#s-done').innerHTML = `<div class="done">
    <h2>完成了！🎉</h2>
    <div class="starrow">${Array.from({length:max}, (_,i) => `<span class="${i<stars?'':'off'}" style="animation-delay:${i*.1}s">⭐</span>`).join('')}</div>
    <p>得到 ${stars} 顆星星（共 ${max} 顆）<br>${msg}</p>
    <div class="lnav"><button class="bigbtn" id="dagain">再玩一次</button><button class="bigbtn alt" id="dmenu">選別的遊戲</button></div>
  </div>`;
  $('#dagain').onclick = again; $('#dmenu').onclick = showMenu;
  sfx.good(); mascot('jump'); confetti();
}
function confetti(){
  const box = $('#confetti'); box.innerHTML = '';
  const cs = ['#FF6B8B','#FFD23F','#2FCB8A','#3BA7F0','#6B3FA0','#FF9F43'];
  for(let i=0;i<60;i++){
    const p = document.createElement('i');
    p.style.left = Math.random()*100 + 'vw';
    p.style.background = cs[i % cs.length];
    p.style.animationDuration = (1.8 + Math.random()*1.8) + 's';
    p.style.animationDelay = (Math.random()*.6) + 's';
    box.appendChild(p);
  }
  setTimeout(() => box.innerHTML = '', 4500);
}

showPick();
</script>
